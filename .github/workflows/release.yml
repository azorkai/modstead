# Modstead sürüm hattı: Windows kurucusunu (NSIS) GitHub'ın Windows sunucusunda derler, SHA-256 özetlerini
# çıkarır ve etiket için TASLAK bir GitHub sürümü açar. Yayımlamak elle yapılır (taslağı incele → Publish).
# Sürüm derlemesi (`tauri build`) yalnızca burada yapılır, geliştirici makinesinde yapılmaz. Ayrıntı: docs/RELEASING.md
#
# Tetikleyiciler:
#   - `v*` etiketi gönderilince: derle ve taslak sürümü aç (etiket, dosyalardaki sürümle aynı olmalı).
#   - Elle (workflow_dispatch): bir dalda çalıştırılırsa yalnızca derler, dosyaları iş akışı eseri olarak bırakır
#     (deneme); bir etikette çalıştırılırsa o etiketin taslağını açar ya da taslaktaki dosyaları yeniler.
#
# Tedarik zinciri: eylemler tam commit SHA'sına sabitlenir (yorumdaki sürüm yalnızca okunabilirlik için), Node ve
# Rust sürümleri sabittir, npm kurulum betikleri kapalıdır (.npmrc), Cargo.lock'tan sapılmaz (--locked). Derleme
# işinin yalnızca okuma izni var; yazma izni, proje kodu çalıştırmayan sürüm işinde.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Projenin geliştirildiği ve denendiği sürümler; değiştirirken en az 14 günlük bir yayın seç.
  NODE_VERSION: "22.23.2"
  RUST_TOOLCHAIN: "1.95.0"
  ARTIFACT: modstead-windows-x64

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      # Windows sunucusundaki Git satır sonlarını öntanımlı olarak CRLF'ye çevirir. Uygulamaya gömülen dosyalar
      # (sim içi paketler, JSON/TSV verileri) yerel derlemede olduğu gibi depodakiyle bayt bayt aynı kalsın.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # npm önbelleği zararsız: npm her paketi package-lock.json'daki sha512 özetiyle doğrular.
          cache: npm

      # Derlemeden önce: dosyalardaki sürümler aynı mı, etiket bu sürüm mü? Değilse burada, açık bir iletiyle durur.
      - name: Check version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            node scripts/release-check.mjs "$REF_NAME"
          else
            node scripts/release-check.mjs
          fi

      # Cargo için önbellek yok, bilerek: sürüm derlemesi her seferinde temiz başlar. Önbellekten dönen crate
      # dosyaları yeniden doğrulanmaz ve bir etiketin önbelleği sonraki etikete zaten geçmez.
      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - name: Install JavaScript dependencies
        run: npm ci

      # `tauri build` önce beforeBuildCommand ile arayüzü derler (npm run build → dist/), sonra Rust uygulamasını
      # sürüm profiliyle derleyip dist/'i ikiliye gömer (MSFS paketinin build.rs'i uçak fotoğraflarını, sim içi
      # paketleri de gömer) ve NSIS kurucusunu üretir. Çıktı: çalışma alanı kökünde target/release/bundle/nsis/.
      #
      # Kod imzalama henüz yok. Sertifika olduğunda tauri.conf.json'da bundle.windows.signCommand (ya da
      # certificateThumbprint) ayarlanır ve gizli değerler bu adıma env olarak verilir; Tauri hem uygulamayı hem
      # kurucuyu imzalar, iş akışının geri kalanı değişmez.
      - name: Build installer
        run: npm run tauri -- build --ci --bundles nsis -- --locked

      # Sürüm dosyaları: sürümlü ad, web sitesinin bağlandığı sabit ad (aynı dosya) ve SHA256SUMS.txt.
      - name: Collect release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s nullglob
          found=(target/release/bundle/nsis/*_x64-setup.exe)
          if [ "${#found[@]}" -ne 1 ]; then
            echo "::error::Expected one NSIS installer in target/release/bundle/nsis, found ${#found[@]}."
            ls -la target/release/bundle/nsis || true
            exit 1
          fi
          versioned="Modstead_${VERSION}_x64-setup.exe"
          stable="Modstead-setup-x64.exe"
          mkdir release
          cp "${found[0]}" "release/$versioned"
          cp "${found[0]}" "release/$stable"
          cd release
          # sha256sum biçimi (`<özet>  <ad>`, LF); Git Bash'in `*` ikili kip işareti kullanılmaz.
          for f in "$versioned" "$stable"; do
            printf '%s  %s\n' "$(sha256sum "$f" | cut -c1-64)" "$f"
          done > SHA256SUMS.txt
          ls -la
          cat SHA256SUMS.txt

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: release/
          if-no-files-found: error
          retention-days: 14
          # Kurucu zaten sıkıştırılmış.
          compression-level: 0

  release:
    name: Create draft release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Sürümü açmak ve dosyaları yüklemek için. Bu iş depoyu çekmez, proje kodu çalıştırmaz.
      contents: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: release

      # Windows'ta çıkarılan özetler burada Linux'ta yeniden doğrulanır; yüklenecek dosyalar tam olarak bunlar.
      - name: Verify checksums
        working-directory: release
        run: |
          ls -la
          sha256sum --check --strict SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 2
          test -f "Modstead_${VERSION}_x64-setup.exe"
          test -f Modstead-setup-x64.exe

      # Sürüm notlarında GitHub tek satır sonunu da satır sonu sayar; bu yüzden her paragraf tek satırdır.
      # gh, otomatik değişiklik listesini (--generate-notes) bu metnin altına ekler.
      - name: Write release notes
        run: |
          sed -e "s|@VERSION@|${VERSION}|g" -e "s|@TAG@|${TAG}|g" -e "s|@REPO@|${GH_REPO}|g" > notes.md <<'EOF'
          ## Download

          **[Modstead-setup-x64.exe](https://github.com/@REPO@/releases/download/@TAG@/Modstead-setup-x64.exe)**: the installer for Windows 10 and 11 (x64). It installs Modstead for the current user and needs no administrator rights.

          | File | What it is |
          |---|---|
          | `Modstead-setup-x64.exe` | The installer. The website links to this name in the latest release. |
          | `Modstead_@VERSION@_x64-setup.exe` | The same file with the version in its name. |
          | `SHA256SUMS.txt` | SHA-256 checksums of both files. |

          Modstead needs Microsoft Edge WebView2, which Windows 11 already includes; if it is missing, the installer downloads it. Modstead does not update itself yet: to update, run the installer from a newer release. Your settings and game data stay in `%APPDATA%\app.modstead`.

          ### Windows SmartScreen

          The installer is not code-signed yet, so your browser may warn that the file is not commonly downloaded and Windows SmartScreen may show "Windows protected your PC". If you downloaded it from this page, keep the file and choose **More info → Run anyway**. Verify the checksum first if you want to be sure the file is the one published here.

          ### Verify the download

          In PowerShell, in the folder you downloaded to:

          ```powershell
          (Get-FileHash .\Modstead-setup-x64.exe -Algorithm SHA256).Hash
          ```

          The result must match the line for the same file in `SHA256SUMS.txt` (upper or lower case does not matter).

          Modstead is free and open source; if it helps you, you can support its development on [Buy Me a Coffee](https://buymeacoffee.com/azorkai).

          ### Türkçe

          `Modstead-setup-x64.exe`, Windows 10 ve 11 (x64) kurucusudur; Modstead'i geçerli kullanıcıya kurar ve yönetici izni istemez. Kurucu henüz kod imzalı olmadığı için tarayıcı ve Windows SmartScreen uyarı gösterebilir: dosyayı bu sayfadan indirdiyseniz **Ek bilgi → Yine de çalıştır**. Dosyayı doğrulamak için PowerShell'de `(Get-FileHash .\Modstead-setup-x64.exe -Algorithm SHA256).Hash` çıktısını `SHA256SUMS.txt` içindeki satırla karşılaştırın.
          EOF
          cat notes.md

      # Taslak varsa yalnızca dosyaları yenilenir (elle düzenlenmiş notlara dokunulmaz); yayımlanmış bir sürümün
      # dosyaları asla değiştirilmez.
      - name: Create or update the draft release
        run: |
          assets=("release/Modstead_${VERSION}_x64-setup.exe" release/Modstead-setup-x64.exe release/SHA256SUMS.txt)
          state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$state" = "false" ]; then
            echo "::error::Release $TAG is already published; its files are not replaced. Release a new version instead."
            exit 1
          elif [ "$state" = "true" ]; then
            echo "Draft release $TAG exists; replacing its files."
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            flags=(--draft --verify-tag --title "Modstead $TAG" --notes-file notes.md --generate-notes)
            if [ "$PRERELEASE" = "true" ]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" "${flags[@]}" "${assets[@]}"
          fi
          echo "Draft: https://github.com/${GH_REPO}/releases (review it, then publish)"
