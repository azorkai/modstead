[workspace]
resolver = "3"
members = [
    "src-tauri",
    "crates/core",
    "games/msfs",
    "games/bannerlord",
    "games/stardew",
    "games/cities2",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Modstead"]
license = "GPL-3.0-only"
repository = "https://github.com/azorkai/modstead"
publish = false

# Sürümler sabittir ve en az 14 günlük yayınlardan seçilmiştir (tedarik zinciri güvenliği).
# Oyun paketleri bağımlılıklarını buradan `{ workspace = true }` ile alır; yeni bağımlılık
# eklemek ortak bir karardır.
[workspace.dependencies]
modstead-core = { path = "crates/core" }

tauri = { version = "=2.12.2", features = [] }
tauri-build = { version = "=2.7.1", features = [] }
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-log = "=2.10.1"
# Uygulamanın kendi güncellemesi (imzalı; bkz. src-tauri/src/updater.rs, docs/RELEASING.md). Varsayılan özellikler
# kapalı: Windows NSIS güncellemesi zip/tar istemez, sistem vekil sunucusu okunmaz (çekirdeğin Http'si gibi).
tauri-plugin-updater = { version = "=2.13.3", default-features = false, features = ["rustls-tls"] }

log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["fs", "process", "time", "sync", "macros", "rt-multi-thread", "io-util"] }
futures-util = "0.3.34"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2", "json", "stream"] }
url = "2.5.8"
roxmltree = "=0.21.1"
zip = { version = "=9.0.0", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma", "xz", "zstd", "ppmd"] }
sevenz-rust2 = { version = "=0.23.0", default-features = false, features = ["bzip2", "ppmd", "deflate", "zstd"] }
unrar = "=0.5.8"
sha2 = "=0.11.0"
md-5 = "=0.11.0"
hex = "0.4.3"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
walkdir = "2.5.0"
# Zaten kilit dosyasında (tauri-utils üzerinden); MSFS exe.xml/Content.xml düzeltmeleri ve kalıplar için.
regex = "=1.13.1"
# MSFS kütüphane modeli (Community'ye junction). Hangar'da denenmiş sürüm; scopeguard ve windows-sys 0.61.2 zaten kilitte.
junction = "=1.4.2"
# Cities: Skylines II kayıt önizlemesi (.cok içindeki zstd sıkıştırılmış RGBA → PNG). İkisi de zaten kilitte
# (zip ve Tauri üzerinden); kullanıcı onayıyla eklendi. Varsayılan özellikler kapalı: zip'in derlemesiyle aynı.
zstd = { version = "=0.13.3", default-features = false }
png = "=0.18.1"
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
